<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#090d10" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/app.css" />
  <title>Meu Treino</title>

<body>

  <nav class="bottom"><button class="active">⚑<span>Treino</span></button><button>◷<span>Histórico</span></button><button>▥<span>Evolução</span></button><button>•••<span>Mais</span></button></nav>
