<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02090d"><title>Meu Treino</title><style>
:root{--bg:#02090d;--card:#071318;--card2:#0a171d;--line:#1b3038;--muted:#91a0a7;--red:#ff292f;--soft:#101e24}*{box-sizing:border-box}html,body{margin:0;background:#02090d;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}body{min-height:100vh;background:radial-gradient(circle at 50% -20%,#13242c 0,#02090d 36%)}button,input{font:inherit}.screen{max-width:430px;margin:auto;min-height:100vh;padding:18px 16px 92px}.row{display:flex;align-items:center}.between{justify-content:space-between}.h1{font-size:29px;font-weight:900;letter-spacing:-.8px;margin:0}.sub{font-size:12px;color:#c0c8cc;letter-spacing:1.2px;margin:2px 0 0}.iconbtn,.back{border:0;background:none;color:#fff;font-size:25px;padding:8px}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0 12px}.tabs button,.seg button{border:1px solid var(--line);background:#071217;color:#cbd3d7;border-radius:8px;height:43px}.tabs .on,.seg .on{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 18px #ff292f33}.hero{height:340px;border-radius:12px;border:1px solid var(--line);position:relative;overflow:hidden;background:linear-gradient(145deg,#111d22,#061014 70%);padding:18px;display:flex;align-items:flex-end}.placeholder{position:absolute;inset:0;display:grid;place-items:center;color:#516168;font-size:13px;letter-spacing:.7px;background:radial-gradient(circle at 50% 38%,#1c2c33,#071116 64%)}.placeholder:before{content:'IMAGEM';border:1px dashed #42545c;border-radius:8px;padding:8px 12px}.heroText{position:relative;z-index:2;text-shadow:0 2px 10px #000}.heroText small{font-weight:800}.heroText h2{font-size:40px;line-height:.95;margin:5px 0 12px}.statsline{display:grid;gap:9px;font-size:13px}.primary{border:0;background:var(--red);color:#fff;width:100%;height:55px;border-radius:8px;font-weight:800;font-size:16px;margin-top:14px;box-shadow:0 8px 24px #ff292f22}.quote{border:1px solid var(--line);background:var(--card);border-radius:9px;margin-top:12px;padding:15px;text-align:center;color:#d5dbde;font-size:13px}.titlebar{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;margin-bottom:14px;text-align:center}.titlebar h1{font-size:21px;margin:0}.titlebar p{margin:2px 0 0;color:#b3bec3;font-size:12px}.list{display:grid;gap:8px}.exercise{min-height:75px;border:1px solid var(--line);background:var(--card);border-radius:9px;display:grid;grid-template-columns:26px 68px 1fr 22px;gap:9px;align-items:center;padding:7px 9px}.exercise.active{border:2px solid var(--red)}.num{font-size:20px;font-weight:800}.phthumb{height:58px;border-radius:6px;background:#14242b;border:1px dashed #3b5059;display:grid;place-items:center;color:#6f8087;font-size:9px}.exercise strong{font-size:15px}.exercise small{display:block;color:#c1c9cc;margin-top:4px}.chev{color:#d2dade;font-size:24px}.photo{height:250px;margin:0 -16px 0;position:relative;background:#0c171c;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.photo .placeholder{font-size:12px}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin:0 -8px 15px}.seg button{height:38px;border-radius:5px;font-size:12px}.detail h2{font-size:23px;margin:8px 0 2px}.muted{color:#aab6bb}.detail p{font-size:13px;line-height:1.45;margin:4px 0}.steps{margin:12px 0;display:grid;gap:6px}.step{display:grid;grid-template-columns:23px 1fr;gap:7px;font-size:12px;align-items:start}.step b{background:#43535b;width:20px;height:20px;border-radius:50%;display:grid;place-items:center}.setcircles{display:flex;justify-content:center;gap:13px;margin:12px 0}.setcircles i{font-style:normal;width:38px;height:38px;border-radius:50%;background:#122128;color:#aab6bb;display:grid;place-items:center;font-weight:800}.setcircles .on{background:var(--red);color:#fff}.timerLabel{text-align:center;margin:10px}.ring{width:230px;height:230px;margin:0 auto 16px;border-radius:50%;background:conic-gradient(var(--red) 0 78%,#203139 78%);display:grid;place-items:center;position:relative}.ring:after{content:'';position:absolute;inset:14px;border-radius:50%;background:#030b0f}.ring strong{z-index:1;font-size:47px}.timerControls{display:grid;grid-template-columns:1fr 65px 1fr;gap:20px;align-items:center}.timerControls button{height:50px;border:1px solid var(--line);background:#102027;color:#fff;border-radius:8px;font-weight:700}.timerControls .pause{height:62px;border-radius:50%;background:var(--red);border:0;font-size:22px}.panel{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:12px;margin-top:14px}.panel label{font-size:12px}.counter{display:grid;grid-template-columns:52px 1fr 52px;gap:7px;margin-top:6px}.counter button,.counter output{height:46px;border:1px solid var(--line);background:#0d1b21;color:#fff;border-radius:7px;display:grid;place-items:center;font-size:21px;font-weight:800}.counter output{font-size:25px}.next{display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:center}.chart{height:190px;border-left:1px solid #25363d;border-bottom:1px solid #25363d;margin:18px 8px 20px;position:relative;background:repeating-linear-gradient(to bottom,transparent 0,transparent 44px,#15262d 45px)}.chart svg{position:absolute;inset:0;width:100%;height:100%}.historyCard,.setting{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:12px;margin:7px 0;display:flex;align-items:center;gap:12px}.historyCard .cal{font-size:25px}.historyCard strong,.setting strong{font-size:13px}.historyCard small{display:block;color:#c0c8cc;margin-top:3px}.metric{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric div{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:13px 5px;text-align:center}.metric b{display:block;font-size:19px}.metric small{color:#c0c8cc}.profile{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:center}.avatar{width:58px;height:58px;border-radius:50%;background:#72828a;display:grid;place-items:center;font-size:21px;font-weight:800}.setting span:last-child{margin-left:auto}.finishHero{height:230px;margin:-18px -16px 0;position:relative;background:#0a151a}.finishHero .check{position:absolute;left:50%;bottom:-30px;transform:translateX(-50%);width:65px;height:65px;background:var(--red);border-radius:50%;display:grid;place-items:center;font-size:30px}.finish{text-align:center;padding-top:48px}.bottom{position:fixed;z-index:20;bottom:0;left:0;right:0;height:76px;background:#02090df5;border-top:1px solid #172930;display:flex;justify-content:center}.bottom button{width:min(25%,108px);border:0;background:none;color:#a2adb2;font-size:20px}.bottom button.on{color:var(--red)}.bottom small{display:block;font-size:10px;margin-top:3px}.hidden{display:none}@media(max-width:370px){.screen{padding-left:12px;padding-right:12px}.hero{height:315px}}
</style></head><body><div id="app"></div><nav class="bottom"><button data-nav="home" class="on">♙<small>Treino</small></button><button data-nav="history">◷<small>Histórico</small></button><button data-nav="progress">▥<small>Evolução</small></button><button data-nav="more">•••<small>Mais</small></button></nav><script>
const W={A:{m:'PEITO',x:[['Supino Reto','6–8',90],['Supino Inclinado Halteres','8–10',75],['Peck Deck','10–12',60],['Crucifixo Inclinado','10–12',60],['Crossover Alto','12–15',45],['Crossover Baixo','12–15',45]]},B:{m:'COSTAS',x:[['Puxada Frontal Aberta','6–10',90],['Remada Máquina','6–10',90],['Remada Baixa Triângulo','8–12',75],['Puxada Neutra','8–12',60],['Remada Unilateral','10–12',60],['Pullover Polia','12–15',45]]},C:{m:'PERNAS',x:[['Agachamento / Hack','6–10',90],['Leg Press 45°','8–12',90],['Stiff / RDL','8–10',75],['Extensora','10–15',60],['Flexora','10–15',60],['Panturrilha','12–20',45]]},D:{m:'OMBROS',x:[['Desenvolvimento Halteres','6–10',90],['Elevação Lateral','10–15',60],['Desenvolvimento Arnold','8–12',75],['Elevação Lateral Polia','12–15',45],['Crucifixo Inverso','12–15',60],['Face Pull','12–15',45]]},E:{m:'BRAÇOS',x:[['Rosca Direta','6–10',60],['Tríceps Testa','6–10',60],['Rosca Scott','8–12',60],['Tríceps Corda','8–12',60],['Rosca Martelo','10–15',45],['Tríceps Francês','10–15',45]]}};
let S={day:'A',ex:0,set:1,kg:60,reps:8,sec:90,timer:null,start:null};const A=document.querySelector('#app');const title=s=>s[0]+s.slice(1).toLowerCase();const fmt=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(Math.max(0,n%60)).padStart(2,'0');function shell(x){A.innerHTML='<main class="screen">'+x+'</main>';scrollTo(0,0)}function nav(n){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('on',b.dataset.nav===n))}function ph(){return '<div class="placeholder"></div>'}function home(){stop();nav('home');let w=W[S.day];shell('<div class="row between"><div><h1 class="h1">Meu Treino</h1><p class="sub">DISCIPLINA HOJE<br>RESULTADOS SEMPRE</p></div><button class="iconbtn">⚙</button></div><div class="tabs">'+Object.keys(W).map(k=>'<button data-day="'+k+'" class="'+(k===S.day?'on':'')+'">'+k+'</button>').join('')+'</div><section class="hero">'+ph()+'<div class="heroText"><small>TREINO '+S.day+'</small><h2>'+w.m+'</h2><div class="statsline"><span>◆ &nbsp; 6 exercícios</span><span>▱ &nbsp; 4 séries</span><span>◉ &nbsp; Foco em hipertrofia</span></div></div></section><button class="primary" id="start">Iniciar treino &nbsp; →</button><div class="quote">❝ &nbsp; “Disciplina hoje,<br>resultados sempre.”</div>');document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{S.day=b.dataset.day;home()});document.querySelector('#start').onclick=()=>{S.start=Date.now();workout()}}function workout(){stop();nav('home');let w=W[S.day];shell('<div class="titlebar"><button class="back">‹</button><div><h1>Treino '+S.day+' - '+title(w.m)+'</h1><p>6 exercícios · 4 séries</p></div><button class="iconbtn">⋮</button></div><div class="list">'+w.x.map((x,i)=>'<div class="exercise '+(i===S.ex?'active':'')+'" data-ex="'+i+'"><span class="num">'+(i+1)+'</span><div class="phthumb">IMAGEM</div><div><strong>'+x[0]+'</strong><small>4 × '+x[1]+'</small></div><span class="chev">›</span></div>').join('')+'</div><button class="primary" id="finish">Finalizar treino</button>');document.querySelector('.back').onclick=home;document.querySelectorAll('[data-ex]').forEach(e=>e.onclick=()=>detail(+e.dataset.ex));document.querySelector('#finish').onclick=finish}function detail(i){S.ex=i;S.set=1;let x=W[S.day].x[i];shell('<div class="titlebar"><button class="back">‹</button><div><h1>'+x[0]+'</h1></div><button class="iconbtn">⋮</button></div><div class="photo">'+ph()+'</div><div class="seg"><button class="on">Execução</button><button>Músculo</button><button>Dicas</button></div><section class="detail"><h2>'+x[0]+'</h2><p class="muted">'+title(W[S.day].m)+'</p><p>4 séries × '+x[1]+' repetições<br>Descanso: '+fmt(x[2])+'</p><b>Como executar</b><div class="steps"><div class="step"><b>1</b><span>Posicione-se de forma estável antes de iniciar.</span></div><div class="step"><b>2</b><span>Mantenha o movimento controlado durante toda a amplitude.</span></div><div class="step"><b>3</b><span>Evite compensações e preserve a técnica.</span></div><div class="step"><b>4</b><span>Complete as repetições previstas com controle.</span></div></div><button class="primary" id="go">Iniciar série 1 &nbsp; →</button></section>');document.querySelector('.back').onclick=workout;document.querySelector('#go').onclick=logger}function logger(){stop();let x=W[S.day].x[S.ex];shell('<div class="titlebar"><button class="back">‹</button><div><h1>'+x[0]+'</h1><p>Série '+S.set+' de 4</p></div><button class="iconbtn">⋮</button></div><div class="photo" style="height:95px">'+ph()+'</div><div class="setcircles">'+[1,2,3,4].map(n=>'<i class="'+(n===S.set?'on':'')+'">'+n+'</i>').join('')+'</div><div class="panel"><label>Carga (kg)</label><div class="counter"><button id="km">−</button><output id="kg">'+S.kg+'</output><button id="kp">+</button></div><br><label>Repetições</label><div class="counter"><button id="rm">−</button><output id="reps">'+S.reps+'</output><button id="rp">+</button></div></div><button class="primary" id="reg">Registrar série &nbsp; ✓</button>');document.querySelector('.back').onclick=()=>detail(S.ex);document.querySelector('#km').onclick=()=>chg('kg',-2.5);document.querySelector('#kp').onclick=()=>chg('kg',2.5);document.querySelector('#rm').onclick=()=>chg('reps',-1);document.querySelector('#rp').onclick=()=>chg('reps',1);document.querySelector('#reg').onclick=save}function chg(k,d){S[k]=Math.max(k==='reps'?1:0,S[k]+d);document.querySelector('#'+(k==='reps'?'reps':'kg')).textContent=S[k]}function save(){let h=JSON.parse(localStorage.getItem('mt7')||'[]');h.unshift({date:new Date().toLocaleDateString('pt-BR'),day:S.day,exercise:W[S.day].x[S.ex][0],set:S.set,kg:S.kg,reps:S.reps,time:Date.now()});localStorage.setItem('mt7',JSON.stringify(h));if(S.set<4)rest();else{S.set=1;if(S.ex<5){S.ex++;workout()}else finish()}}function rest(){S.sec=W[S.day].x[S.ex][2];renderRest();S.timer=setInterval(tick,1000)}function tick(){S.sec--;let c=document.querySelector('#clock');if(c)c.textContent=fmt(S.sec);if(S.sec<=0){stop();S.set++;logger()}}function restInterval(){S.timer=setInterval(tick,1000)}function renderRest(){let x=W[S.day].x[S.ex];shell('<div class="titlebar"><button class="back">‹</button><div><h1>'+x[0]+'</h1><p>Série '+S.set+' de 4</p></div><button class="iconbtn">⋮</button></div><div class="setcircles">'+[1,2,3,4].map(n=>'<i class="'+(n===S.set?'on':'')+'">'+n+'</i>').join('')+'</div><div class="timerLabel">Descanso</div><div class="ring"><strong id="clock">'+fmt(S.sec)+'</strong></div><div class="timerControls"><button id="minus">−15s</button><button class="pause" id="pause">Ⅱ</button><button id="plus">+15s</button></div><div class="panel next"><div class="phthumb">IMAGEM</div><div><small>Próxima série</small><br><strong>'+x[0]+'</strong><br><small>4 × '+x[1]+'</small></div></div><button class="primary" id="skip" style="background:#1a2b33">Pular descanso &nbsp; →</button>');let paused=false;document.querySelector('.back').onclick=()=>{stop();logger()};document.querySelector('#minus').onclick=()=>{S.sec=Math.max(0,S.sec-15);document.querySelector('#clock').textContent=fmt(S.sec)};document.querySelector('#plus').onclick=()=>{S.sec+=15;document.querySelector('#clock').textContent=fmt(S.sec)};document.querySelector('#pause').onclick=e=>{paused=!paused;if(paused){stop();e.target.textContent='▶'}else{restInterval();e.target.textContent='Ⅱ'}};document.querySelector('#skip').onclick=()=>{stop();S.set++;logger()}}function stop(){if(S.timer){clearInterval(S.timer);S.timer=null}}function history(){stop();nav('history');let h=JSON.parse(localStorage.getItem('mt7')||'[]');shell('<h1 class="h1">Histórico</h1><div class="seg" style="margin:12px 0"><button class="on">Semana</button><button>Mês</button><button>Ano</button></div><b>Carga no Supino Reto (kg)</b><div class="chart"><svg viewBox="0 0 300 180" preserveAspectRatio="none"><polyline points="0,150 70,130 145,105 220,78 300,35" fill="none" stroke="#ff292f" stroke-width="4"/></svg></div><b>Últimos registros</b>'+(h.length?h.slice(0,8).map(x=>'<div class="historyCard"><span class="cal">▣</span><div><strong>'+x.date+' · '+x.exercise+'</strong><small>'+x.kg+' kg × '+x.reps+' reps · série '+x.set+'</small></div><span class="chev">›</span></div>').join(''):'<div class="quote">Nenhuma série registrada ainda.</div>'))}function progress(){stop();nav('progress');let h=JSON.parse(localStorage.getItem('mt7')||'[]'),best=h.reduce((m,x)=>Math.max(m,+x.kg||0),0);shell('<h1 class="h1">Evolução</h1><div class="seg" style="grid-template-columns:repeat(4,1fr);margin:12px 0"><button class="on">Carga</button><button>Volume</button><button>1RM</button><button>Fotos</button></div><div class="row between"><b>Supino Reto</b><span class="muted">Últimos 3 meses</span></div><div class="chart"><svg viewBox="0 0 300 180" preserveAspectRatio="none"><polyline points="0,145 75,125 150,100 225,76 300,38" fill="none" stroke="#ff292f" stroke-width="4"/></svg></div><div class="metric"><div><b>'+h.length+'</b><small>Séries</small></div><div><b>'+best+' kg</b><small>Melhor carga</small></div><div><b>'+new Set(h.map(x=>x.date)).size+'</b><small>Dias</small></div></div><div class="panel"><b>🏆 Melhor série</b><p>'+(best?best+' kg':'—')+'</p></div>')}function more(){stop();nav('more');shell('<h1 class="h1">Mais</h1><div class="panel profile"><div class="avatar">RP</div><div><b>Meu Treino</b><p class="muted">Foco, disciplina, resultado.</p></div></div>'+['⚙|Configurações','⟳|Backup e restauração','☼|Temas','♧|Notificações','ⓘ|Sobre o app'].map(s=>{let a=s.split('|');return '<div class="setting"><span>'+a[0]+'</span><strong>'+a[1]+'</strong><span>›</span></div>'}).join('')+'<div class="quote">❝<br>“Disciplina hoje,<br>resultados sempre.”</div>')}function finish(){stop();nav('home');let dur=S.start?Math.max(1,Math.round((Date.now()-S.start)/60000)):0;let h=JSON.parse(localStorage.getItem('mt7')||'[]'),today=new Date().toLocaleDateString('pt-BR'),sets=h.filter(x=>x.date===today&&x.day===S.day).length;shell('<div class="finishHero">'+ph()+'<div class="check">✓</div></div><div class="finish"><h1>Treino finalizado!</h1><p class="muted">Excelente trabalho hoje.<br>Consistência gera resultados.</p><div class="metric"><div><b>6</b><small>Exercícios</small></div><div><b>'+sets+'</b><small>Séries</small></div><div><b>'+dur+' min</b><small>Duração</small></div></div><button class="primary" id="summary">Ver resumo</button><button class="primary" id="home" style="background:#14252d">Voltar para a Home</button></div>');document.querySelector('#summary').onclick=history;document.querySelector('#home').onclick=()=>{S.ex=0;S.set=1;S.start=null;home()}}document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>({home,history,progress,more}[b.dataset.nav]||home)());home();
</script></body></html>
