<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b0e"><title>Meu Treino</title><style>
:root{--bg:#05090c;--panel:#0c1418;--line:#253239;--muted:#94a0a6;--red:#ff343b;--green:#71e29b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#132027 0,#05090c 32%);color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:520px;margin:auto;padding:22px 15px 105px;min-height:100vh}button{font:inherit}.top,.titlebar{display:flex;align-items:center;justify-content:space-between}.top h1,.titlebar h1{font-size:32px;margin:0;font-weight:900;letter-spacing:-1px}.sub,.titlebar p{color:var(--muted);font-size:11px;letter-spacing:1.4px;margin:4px 0}.icon,.back{width:46px;height:46px;border:1px solid var(--line);background:#0d1519;color:#fff;border-radius:14px;font-size:22px}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:22px 0 17px}.days button{height:50px;border:1px solid var(--line);background:#0b1216;color:white;border-radius:14px;font-weight:850;font-size:18px}.days .active{background:var(--red);border-color:var(--red);box-shadow:0 8px 24px #ff343b33}.hero{height:365px;border:1px solid var(--line);border-radius:27px;position:relative;overflow:hidden;background:radial-gradient(circle at 75% 35%,#6a2226 0,#172126 31%,#091014 68%);display:flex;align-items:flex-end;padding:25px}.anatomy{position:absolute;right:-5px;top:18px;width:225px;height:310px;filter:drop-shadow(0 18px 24px #0009)}.head{position:absolute;left:88px;width:49px;height:58px;border-radius:50%;background:linear-gradient(#778187,#465159)}.torso{position:absolute;top:54px;left:31px;width:165px;height:245px;background:linear-gradient(100deg,#4b575e,#788187 48%,#333e44);clip-path:polygon(27% 0,73% 0,100% 25%,78% 48%,67% 100%,33% 100%,22% 48%,0 25%)}.pec{position:absolute;top:90px;width:67px;height:62px;background:linear-gradient(145deg,#ff5a55,#d91927);z-index:2;box-shadow:inset 0 -8px 15px #8c1018}.pec.l{left:43px;border-radius:48% 20% 46% 50%}.pec.r{right:43px;border-radius:20% 48% 50% 46%}.heroCopy{position:relative;z-index:3;text-shadow:0 3px 12px #000}.heroCopy small{font-weight:850}.heroCopy h2{font-size:45px;line-height:.9;margin:6px 0 11px}.heroCopy p{color:#d5d9db;margin:0}.primary{width:100%;height:65px;border:0;border-radius:18px;background:linear-gradient(100deg,#ff5049,var(--red));color:#fff;font-weight:900;font-size:18px;margin:16px 0;box-shadow:0 12px 28px #ff343b22}.label{font-size:12px;color:var(--muted);letter-spacing:1.4px;margin:28px 3px 10px}.list{display:grid;gap:9px}.card{min-height:73px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(100deg,#0d1519,#091115);display:flex;align-items:center;padding:10px 13px;gap:12px}.card.active{border-color:var(--red);box-shadow:inset 3px 0 var(--red)}.badge,.thumb{width:48px;height:48px;flex:0 0 48px;border-radius:13px;background:radial-gradient(circle,#462126,#151b1f 70%);display:grid;place-items:center;color:#ff575c;font-weight:900}.card strong{display:block;font-size:16px}.card small{display:block;color:var(--muted);margin-top:3px}.arrow{margin-left:auto;color:#9ba5aa;font-size:25px}.titlebar{justify-content:flex-start;gap:13px;margin-bottom:18px}.titlebar h1{font-size:21px}.progress{height:7px;background:#202b30;border-radius:9px;overflow:hidden;margin:10px 0 20px}.progress i{display:block;height:100%;background:var(--red);width:0}.detailHero{height:245px;border:1px solid var(--line);border-radius:24px;background:radial-gradient(circle at 50% 60%,#502126,#121b20 48%,#091014);display:grid;place-items:center;overflow:hidden}.barbell{font-size:90px;filter:drop-shadow(0 15px 12px #000)}.detail h2{font-size:28px;margin:20px 0 8px}.pills{display:flex;gap:7px}.pill{padding:7px 10px;background:#132027;border-radius:10px;font-size:11px}.pill.red{background:var(--red)}.stats{line-height:1.7}.tip{padding:15px;border:1px solid #28404a;background:#0b171c;border-radius:16px;color:#d7dddf}.timerRing{width:245px;height:245px;border-radius:50%;margin:30px auto;display:grid;place-items:center;background:conic-gradient(var(--red) 0 82%,#26343b 82%);position:relative;box-shadow:0 0 35px #ff343b22}.timerRing:after{content:"";position:absolute;inset:16px;border-radius:50%;background:#071014}.timerRing div{z-index:2;text-align:center}.timerRing small{display:block;color:#c2c8cb}.timerRing strong{font-size:49px}.timerBtns,.counter{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.timerBtns button,.counter button,.counter output{height:54px;border:1px solid var(--line);border-radius:14px;background:#101a1f;color:#fff;display:grid;place-items:center;font-weight:850;font-size:18px}.timerBtns .pause{background:var(--red);border-color:var(--red);border-radius:50%;width:54px;justify-self:center}.field{margin:17px 0}.field label{display:block;color:#b5bdc1;margin-bottom:8px}.counter output{font-size:24px}.sets{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:16px 0}.setdot{height:8px;background:#26343b;border-radius:8px}.setdot.done{background:var(--red)}.bottom{position:fixed;bottom:0;left:0;right:0;height:82px;background:#071014ee;border-top:1px solid #202c32;display:flex;justify-content:center;backdrop-filter:blur(12px);z-index:20}.bottom button{width:min(25%,130px);border:0;background:none;color:#7f8a91}.bottom button.active{color:var(--red)}.bottom span{display:block;font-size:11px;margin-top:4px}.historyItem{margin-bottom:9px}.empty{color:var(--muted);padding:25px;text-align:center;border:1px dashed var(--line);border-radius:18px}.metric{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric div{padding:18px 8px;text-align:center;border:1px solid var(--line);border-radius:17px;background:var(--panel)}.metric b{display:block;font-size:20px;color:#fff}.metric small{color:var(--muted)}.chart{height:190px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(#0c161b,#091014);position:relative;overflow:hidden;margin:12px 0 20px}.chart svg{width:100%;height:100%}.quote{margin-top:20px;padding:26px;text-align:center;border:1px solid var(--line);border-radius:20px;color:#ccd2d5}.status{text-align:center;color:var(--green);font-size:11px;margin-top:18px}@media(max-width:380px){.app{padding-left:12px;padding-right:12px}.hero{height:340px}.anatomy{right:-25px;transform:scale(.9)}}
</style></head><body><div id="app"></div><nav class="bottom"><button data-nav="home" class="active">⌂<span>Treino</span></button><button data-nav="history">◷<span>Histórico</span></button><button data-nav="progress">▥<span>Evolução</span></button><button data-nav="more">•••<span>Mais</span></button></nav><script>
const W={A:{m:'PEITO',x:[['Supino reto','6–8',90],['Supino inclinado halteres','8–10',75],['Peck Deck','10–12',60],['Crucifixo inclinado','10–12',60],['Crossover alto','12–15',45],['Crossover baixo','12–15',45]]},B:{m:'COSTAS',x:[['Puxada frontal aberta','6–10',90],['Remada máquina','6–10',90],['Remada baixa triângulo','8–12',75],['Puxada neutra','8–12',60],['Remada unilateral','10–12',60],['Pullover polia','12–15',45]]},C:{m:'PERNAS',x:[['Agachamento / Hack','6–10',90],['Leg press 45°','8–12',90],['Stiff / RDL','8–10',75],['Extensora','10–15',60],['Flexora','10–15',60],['Panturrilha','12–20',45]]},D:{m:'OMBROS',x:[['Desenvolvimento halteres','6–10',90],['Elevação lateral','10–15',60],['Desenvolvimento Arnold','8–12',75],['Elevação lateral polia','12–15',45],['Crucifixo inverso','12–15',60],['Face pull','12–15',45]]},E:{m:'BRAÇOS',x:[['Rosca direta','6–10',60],['Tríceps testa','6–10',60],['Rosca Scott','8–12',60],['Tríceps corda','8–12',60],['Rosca martelo','10–15',45],['Tríceps francês','10–15',45]]}};
let day='A',ex=0,set=1,kg=60,reps=8,sec=90,timer=null;const root=document.querySelector('#app');function shell(s){root.innerHTML='<main class="app">'+s+'<div class="status">✓ Meu Treino · versão 6</div></main>';scrollTo(0,0)}function anatomy(){return '<div class="anatomy"><div class="head"></div><div class="torso"></div><div class="pec l"></div><div class="pec r"></div></div>'}function navActive(n){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===n))}function home(){clearInterval(timer);navActive('home');let w=W[day];shell('<div class="top"><div><h1>Meu Treino</h1><p class="sub">DISCIPLINA HOJE · RESULTADOS SEMPRE</p></div><button class="icon">⚙</button></div><div class="days">'+Object.keys(W).map(k=>'<button data-day="'+k+'" class="'+(k===day?'active':'')+'">'+k+'</button>').join('')+'</div><section class="hero">'+anatomy()+'<div class="heroCopy"><small>TREINO '+day+'</small><h2>'+w.m+'</h2><p>6 exercícios · 4 séries</p></div></section><button class="primary" id="start">Iniciar treino →</button><h3 class="label">OUTROS TREINOS</h3><div class="list">'+Object.entries(W).filter(([k])=>k!==day).map(([k,v])=>'<div class="card" data-day="'+k+'"><div class="badge">'+k+'</div><strong>'+title(v.m)+'</strong><span class="arrow">›</span></div>').join('')+'</div>');document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{day=b.dataset.day;home()});document.querySelector('#start').onclick=workout}function title(s){return s[0]+s.slice(1).toLowerCase()}function workout(){clearInterval(timer);navActive('home');let w=W[day];shell('<div class="titlebar"><button class="back">‹</button><div><h1>Treino '+day+' - '+title(w.m)+'</h1><p>6 exercícios · 4 séries</p></div></div><div class="progress"><i style="width:0"></i></div><div class="list">'+w.x.map((a,i)=>'<div class="card '+(i===0?'active':'')+'" data-ex="'+i+'"><div class="badge">'+(i+1)+'</div><div><strong>'+a[0]+'</strong><small>4 × '+a[1]+' · '+a[2]+'s descanso</small></div><span class="arrow">›</span></div>').join('')+'</div><button class="primary" id="finish">⚑ Finalizar treino</button>');document.querySelector('.back').onclick=home;document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>detail(+b.dataset.ex));document.querySelector('#finish').onclick=home}function detail(i){ex=i;set=1;let a=W[day].x[i];shell('<div class="titlebar"><button class="back">‹</button><div><h1>'+a[0]+'</h1><p>'+title(W[day].m)+'</p></div></div><div class="detailHero"><div class="barbell">🏋️</div></div><section class="detail"><h2>'+a[0]+'</h2><div class="pills"><span class="pill red">Exercício principal</span><span class="pill">'+title(W[day].m)+'</span></div><p class="stats">4 séries × '+a[1]+' repetições<br>Descanso: '+fmt(a[2])+'</p><div class="tip">💡 <b>Dica</b><br>Movimento controlado, amplitude segura e execução consistente.</div><button class="primary" id="go">Iniciar série 1 →</button></section>');document.querySelector('.back').onclick=workout;document.querySelector('#go').onclick=logger}function fmt(n){return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}function logger(){clearInterval(timer);let a=W[day].x[ex];shell('<div class="titlebar"><button class="back">‹</button><div><h1>'+a[0]+'</h1><p>Série '+set+' de 4</p></div></div><div class="sets">'+[1,2,3,4].map(n=>'<i class="setdot '+(n<set?'done':'')+'"></i>').join('')+'</div><div class="field"><label>Carga (kg)</label><div class="counter"><button id="km">−</button><output id="kg">'+kg+'</output><button id="kp">+</button></div></div><div class="field"><label>Repetições</label><div class="counter"><button id="rm">−</button><output id="rpv">'+reps+'</output><button id="rp">+</button></div></div><button class="primary" id="reg">Registrar série '+set+' ✓</button>');document.querySelector('.back').onclick=()=>detail(ex);document.querySelector('#km').onclick=()=>{kg=Math.max(0,kg-2.5);document.querySelector('#kg').textContent=kg};document.querySelector('#kp').onclick=()=>{kg+=2.5;document.querySelector('#kg').textContent=kg};document.querySelector('#rm').onclick=()=>{reps=Math.max(1,reps-1);document.querySelector('#rpv').textContent=reps};document.querySelector('#rp').onclick=()=>{reps++;document.querySelector('#rpv').textContent=reps};document.querySelector('#reg').onclick=saveSet}function saveSet(){let h=JSON.parse(localStorage.getItem('mtHistory')||'[]');h.unshift({d:new Date().toLocaleDateString('pt-BR'),day,n:W[day].x[ex][0],set,kg,reps});localStorage.setItem('mtHistory',JSON.stringify(h));if(set<4){rest()}else{set=1;workout()}}function rest(){sec=W[day].x[ex][2];renderRest();timer=setInterval(()=>{sec--;let c=document.querySelector('#clock');if(c)c.textContent=fmt(sec);if(sec<=0){clearInterval(timer);set++;logger()}},1000)}function renderRest(){shell('<div class="titlebar"><button class="back">‹</button><div><h1>'+W[day].x[ex][0]+'</h1><p>Série '+set+' concluída</p></div></div><div class="timerRing"><div><small>Descanso</small><strong id="clock">'+fmt(sec)+'</strong></div></div><div class="timerBtns"><button id="minus">−15s</button><button class="pause" id="pause">Ⅱ</button><button id="plus">+15s</button></div><button class="primary" id="skip">Pular descanso →</button>');let paused=false;document.querySelector('.back').onclick=()=>{clearInterval(timer);logger()};document.querySelector('#minus').onclick=()=>{sec=Math.max(0,sec-15);document.querySelector('#clock').textContent=fmt(sec)};document.querySelector('#plus').onclick=()=>{sec+=15;document.querySelector('#clock').textContent=fmt(sec)};document.querySelector('#pause').onclick=e=>{paused=!paused;if(paused){clearInterval(timer);e.target.textContent='▶'}else{timer=setInterval(()=>{sec--;document.querySelector('#clock').textContent=fmt(sec);if(sec<=0){clearInterval(timer);set++;logger()}},1000);e.target.textContent='Ⅱ'}};document.querySelector('#skip').onclick=()=>{clearInterval(timer);set++;logger()}}function history(){clearInterval(timer);navActive('history');let h=JSON.parse(localStorage.getItem('mtHistory')||'[]');shell('<div class="top"><h1>Histórico</h1></div><h3 class="label">SÉRIES REGISTRADAS</h3>'+(h.length?'<div class="list">'+h.slice(0,30).map(x=>'<div class="card historyItem"><div class="badge">'+x.day+'</div><div><strong>'+x.n+'</strong><small>'+x.d+' · Série '+x.set+' · '+x.kg+' kg × '+x.reps+'</small></div></div>').join('')+'</div>':'<div class="empty">Seu histórico aparecerá aqui depois do primeiro treino.</div>'))}function progress(){clearInterval(timer);navActive('progress');let h=JSON.parse(localStorage.getItem('mtHistory')||'[]'),best=h.reduce((m,x)=>Math.max(m,+x.kg||0),0);shell('<div class="top"><h1>Evolução</h1></div><h3 class="label">RESUMO</h3><div class="metric"><div><b>'+h.length+'</b><small>Séries</small></div><div><b>'+best+' kg</b><small>Maior carga</small></div><div><b>'+new Set(h.map(x=>x.d)).size+'</b><small>Dias</small></div></div><h3 class="label">PROGRESSO</h3><div class="chart"><svg viewBox="0 0 300 180" preserveAspectRatio="none"><polyline points="0,155 70,135 145,105 220,78 300,35" fill="none" stroke="#ff343b" stroke-width="4"/><line x1="0" y1="155" x2="300" y2="155" stroke="#26343b"/></svg></div>')}function more(){clearInterval(timer);navActive('more');shell('<div class="top"><h1>Mais</h1></div><div class="card" style="margin-top:18px"><div class="badge">MT</div><div><strong>Meu Treino</strong><small>Treino ABCDE · 40 minutos</small></div></div><div class="quote">❝<br><br>Disciplina hoje,<br><b>resultados sempre.</b></div><button class="primary" id="export">Exportar histórico</button>');document.querySelector('#export').onclick=()=>{let data=localStorage.getItem('mtHistory')||'[]';navigator.clipboard?.writeText(data);alert('Histórico copiado para a área de transferência.')}}document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>({home,history,progress,more}[b.dataset.nav]||home)());home();
</script></body></html>
